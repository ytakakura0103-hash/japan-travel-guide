<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plan Your Japan Trip - Itinerary Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="itinerary.html">Itinerary Planner</a>
    <a href="spots.html">Hidden Gems</a>
    <a href="privacy.html">Privacy</a>
  </nav>
  <main>
    <h1>Find Your Japan Itinerary</h1>
    <form id="itinerary-form">
      <label>
        Days
        <select name="days">
          <option value="">Any</option>
          <option value="3">3</option>
          <option value="5">5</option>
          <option value="7">7</option>
        </select>
      </label>
      <label>
        Area
        <select name="area">
          <option value="">Any</option>
          <option value="Tokyo">Tokyo</option>
          <option value="Kyoto">Kyoto</option>
          <option value="Osaka">Osaka</option>
        </select>
      </label>
      <button type="submit">Search</button>
    </form>
    <div id="results"></div>
  </main>
  <script type="module" src="src/itinerary-page.js"></script>
</body>
</html>
