<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-labelledby="avatarTitle">
  <title id="avatarTitle">Simple line illustration of Yusuke</title>
  <circle cx="80" cy="80" r="78" fill="#F5F7FA" stroke="#DDD8CF" stroke-width="2" />
  <g fill="none" stroke="#1F3F5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- shoulders / body -->
    <path d="M28 148c6-30 30-46 52-46s46 16 52 46" />
    <!-- neck -->
    <path d="M68 100v10c0 7 6 12 12 12s12-5 12-12v-10" />
    <!-- head -->
    <ellipse cx="80" cy="66" rx="30" ry="34" />
    <!-- hair -->
    <path
      d="M50 60c-2-22 14-38 30-38s32 16 30 38c-4-10-12-16-20-16-2 6-8 10-14 10-4 0-7-2-9-5-6 3-13 6-17 11z"
      fill="#1F3F5C"
      stroke="none"
    />
    <!-- ear hints -->
    <path d="M50 62c-4 1-6 5-5 9" />
    <path d="M110 62c4 1 6 5 5 9" />
    <!-- eyes -->
    <path d="M68 66c2-2 6-2 8 0" />
    <path d="M84 66c2-2 6-2 8 0" />
    <!-- smile -->
    <path d="M70 80c4 5 16 5 20 0" />
  </g>
  <!-- accent mark: small torii nod, tucked bottom-right -->
  <g stroke="#BD3B26" stroke-width="3" stroke-linecap="round">
    <path d="M126 132h20" />
    <path d="M130 132v14" />
    <path d="M142 132v14" />
  </g>
</svg>
