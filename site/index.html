<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Japan Travel Guide - Find Activities & Hidden Gems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="privacy.html">Privacy</a>
  </nav>
  <header class="search-hero">
    <h1>Find Things to Do in Japan</h1>
    <p class="search-hero-lede">
      Free activity picks for visitors to Japan, put together by someone who actually knows the travel
      industry and the culture — not a generic listicle.
    </p>
    <form id="activity-form">
      <div class="search-form-row">
        <label>
          City
          <select name="city">
            <option value="">Any</option>
            <option value="Tokyo">Tokyo</option>
            <option value="Kyoto">Kyoto</option>
            <option value="Osaka">Osaka</option>
          </select>
        </label>
        <button type="submit" class="search-submit">Search</button>
      </div>
      <div class="interest-grid">
        <label class="interest-option"><input type="checkbox" name="interests" value="sightseeing" /> Sightseeing Spots</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="history" /> History</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="food" /> Food &amp; Dining</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="shopping" /> Shopping</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="nature" /> Nature &amp; Parks</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="temples-shrines" /> Temples &amp; Shrines</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="nightlife" /> Nightlife</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="pop-culture" /> Anime &amp; Pop Culture</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="traditional-culture" /> Traditional Crafts &amp; Culture</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="art-museums" /> Art &amp; Museums</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="local-markets" /> Local Markets</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="cafes-sweets" /> Cafes &amp; Sweets</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="onsen" /> Onsen &amp; Relaxation</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="festivals" /> Festivals &amp; Events</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="architecture" /> Architecture</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="photo-spots" /> Photo Spots</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="family" /> Family-Friendly</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="outdoor" /> Outdoor &amp; Sports</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="backstreets" /> Backstreets &amp; Local Neighborhoods</label>
        <label class="interest-option"><input type="checkbox" name="interests" value="seasonal-nature" /> Seasonal Nature (Cherry Blossoms / Autumn Leaves)</label>
      </div>
    </form>
  </header>
  <div class="map-embed">
    <iframe src="https://www.google.com/maps/d/embed?mid=REPLACE_WITH_MY_MAPS_ID" loading="lazy"></iframe>
  </div>
  <hr class="divider" />
  <div id="results" class="results-grid"></div>
  <a href="#activity-form" class="back-to-top" id="back-to-top" aria-label="Back to search">↑ Back to search</a>
  <script type="module" src="src/activities-page.js"></script>
</body>
</html>
